    --scene-dunk:var(--scene-lebron);--scene-buzzer:var(--scene-curry);--scene-champion:var(--scene-curry);
    --ink:#f8fafc;--muted:#9ca8ba;--line:rgba(255,255,255,.14);
    --glass:rgba(17,21,29,.56);--glass-strong:rgba(11,14,20,.78);

  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070a}
  body{position:fixed;inset:0;display:flex;flex-direction:column;color:var(--ink);background:radial-gradient(circle at 80% 0,rgba(23,104,187,.18),transparent 38%),#05070a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-overflow-scrolling:touch}
  body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(180deg,rgba(4,6,9,.48),rgba(4,6,9,.84)),var(--scene-lebron);background-size:cover;background-position:50% 42%;filter:saturate(.84) contrast(1.04);opacity:.7;pointer-events:none;transform:translateZ(0)}
  button,input,select{font-family:inherit}
  button{touch-action:manipulation}
  .topbar{position:relative;z-index:2;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;min-height:68px;padding:calc(9px + constant(safe-area-inset-top)) 13px 9px;padding:calc(9px + env(safe-area-inset-top)) 13px 9px;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.14);background:linear-gradient(90deg,rgba(3,5,8,.76),rgba(3,5,8,.28)),var(--scene-curry);background-size:cover;background-position:67% 32%;box-shadow:0 10px 26px rgba(0,0,0,.24);transform:translateZ(0);animation:headerDrop .44s cubic-bezier(.2,.8,.2,1) both}
  .topbar:before{content:"";position:absolute;top:-65%;bottom:-65%;left:-40%;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translate3d(-180%,0,0) rotate(14deg);animation:headerSheen 6.8s ease-in-out 1.1s infinite;pointer-events:none}
  .topbar:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 36%,rgba(0,0,0,.12));pointer-events:none}
  .brand{position:relative;z-index:1;min-width:0}
  .eyebrow{display:flex;align-items:center;gap:6px;margin-bottom:2px;color:rgba(255,255,255,.64);font-size:8px;font-weight:800;letter-spacing:1.8px}
  .eyebrow:before{content:"";width:5px;height:5px;border-radius:50%;background:#70b9ff;box-shadow:0 0 10px rgba(112,185,255,.9);animation:livePulse 2.2s ease-in-out infinite}
  .topbar h1{font-size:18px;font-weight:900;letter-spacing:-.45px;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.72);white-space:nowrap}
  .topbar h1 span{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:0}
  .ver{position:relative;z-index:1;flex-shrink:0;margin-left:10px;padding:4px 8px;border-radius:999px;font-size:8px;font-weight:800;letter-spacing:.7px;color:#e4f2ff;background:rgba(112,185,255,.17);border:1px solid rgba(154,207,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.26);-webkit-backdrop-filter:blur(9px) saturate(1.2);backdrop-filter:blur(9px) saturate(1.2)}
  .mode-bar{position:relative;z-index:3;flex-shrink:0;display:flex;gap:6px;padding:6px 9px;background:rgba(5,7,10,.7);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 7px 20px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(12px) saturate(1.25);backdrop-filter:blur(12px) saturate(1.25);transform:translateZ(0)}
  .mode-btn{position:relative;flex:1;min-height:36px;padding:5px 8px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);color:#909cad;font:inherit;font-size:11px;font-weight:800;text-align:center;cursor:pointer;overflow:hidden;transition:transform .16s ease,color .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease;-webkit-appearance:none;appearance:none;-webkit-backface-visibility:hidden;backface-visibility:hidden}
  .mode-btn:before{content:"";position:absolute;left:18%;right:18%;bottom:0;height:2px;border-radius:3px;background:var(--blue);transform:scaleX(0);transition:transform .25s ease;box-shadow:0 0 12px var(--blue)}
  .mode-btn:active{transform:translateZ(0) scale(.97)}
  .mode-btn.active{color:#fff;border-color:rgba(147,202,255,.32);background:linear-gradient(135deg,rgba(53,136,224,.42),rgba(19,65,112,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 8px 20px rgba(5,66,128,.2)}
  .mode-btn.active:before{transform:scaleX(1)}
  .scroll{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:7px 8px calc(16px + constant(safe-area-inset-bottom));padding:7px 8px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .scroll::-webkit-scrollbar{width:0;height:0}
  #status{position:sticky;top:0;z-index:8;min-height:31px;padding:7px 9px 7px 27px;margin-bottom:7px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(8,11,16,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 8px 20px rgba(0,0,0,.23);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;line-height:1.45;color:#bac5d3;white-space:pre-line;word-break:break-all;max-height:54px;overflow:hidden;transform:translateZ(0)}
  #status:before{content:"";position:absolute;left:11px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(94,230,173,.1),0 0 13px rgba(94,230,173,.7)}
  #status.pulse-a,#status.pulse-b{animation:statusPulse .38s ease}
  .panel{display:none}
  .panel.active{display:block;animation:panelIn .3s cubic-bezier(.2,.8,.2,1)}
  .panel.active>.scene-card{animation:cardIn .42s cubic-bezier(.16,.84,.24,1) both}
  .panel.active>.scene-card:nth-of-type(2){animation-delay:.045s}.panel.active>.scene-card:nth-of-type(3){animation-delay:.09s}.panel.active>.scene-card:nth-of-type(4){animation-delay:.135s}
  .scene-card{--scene:var(--scene-dunk);position:relative;margin-bottom:7px;padding:9px;border:1px solid rgba(255,255,255,.16);border-radius:14px;overflow:hidden;background-color:#0a0d12;background-image:linear-gradient(105deg,rgba(5,8,13,.76) 0%,rgba(7,10,16,.61) 58%,rgba(7,10,16,.39) 100%),var(--scene);background-size:cover;background-position:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 9px 24px rgba(0,0,0,.22);transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:border-color .25s ease,box-shadow .25s ease}
  .scene-card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent 35%,rgba(255,255,255,.025));pointer-events:none}
  .scene-card>*{position:relative;z-index:1}
  .scene-dunk{--scene:var(--scene-dunk);background-position:50% 43%}
  .scene-buzzer{--scene:var(--scene-buzzer);background-position:69% 36%}
  .scene-champion{--scene:var(--scene-champion);background-position:68% 34%}
  .sec{display:flex;align-items:center;gap:7px;margin:0 0 8px;color:rgba(255,255,255,.68);font-size:8px;font-weight:900;letter-spacing:1.55px;text-transform:uppercase}
  .sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.23),transparent)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

    var opening=!c.classList.contains('open');

    c.classList.toggle('open',opening);h.setAttribute('aria-expanded',opening?'true':'false');
    if(opening){b.style.maxHeight='none'}
    else{b.style.maxHeight='0px'}
  }
  h.addEventListener('click',toggleCollapse);
  h.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCollapse()}});
  c.appendChild(h);c.appendChild(b);
  return c;
}

// === ANIMATION WRITERS ===
function writeCombo(offset,value,type){
  var dz=getDz0();h5gg.setValue(dz+offset,String(value),type||"U8");
}
function writeComboU16(offset,value){var dz=getDz0();h5gg.setValue(dz+offset,String(value),"U16")}

function buildAnimSections(containerId){
  var c=document.getElementById(containerId);

  // 运球风格
  c.appendChild(makeCollapse('运球风格',function(b){
    b.appendChild(makeRow('运球风格',dribble_opts,function(v){
      var dz=getDz0();h5gg.setValue(dz+0x312,String(v*8),"U8");
      show('运球风格: '+dribble_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 花式运球
  c.appendChild(makeCollapse('花式运球',function(b){
    b.appendChild(makeRow('花式运球',fancy_opts,function(v){
      var dz=getDz0();h5gg.setValue(dz+0x314,String(v),"U8");
      show('花式运球: '+fancy_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 摆脱动作
  c.appendChild(makeCollapse('摆脱动作',function(b){
    b.appendChild(makeRow('摆脱动作',escape_opts,function(v){
      var dz=getDz0();h5gg.setValue(dz+0x314,String(0xC00F+v*0x80),"U16");
      show('摆脱动作: '+escape_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 组合动作
  c.appendChild(makeCollapse('组合动作',function(b){
    b.appendChild(makeRow('组合动作',combo_opts,function(v){
      var dz=getDz0();h5gg.setValue(dz+0x329,String(v*8),"U8");
      show('组合动作: '+combo_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 分解组合
  c.appendChild(makeCollapse('分解组合动作',function(b){
    b.appendChild(makeRow('分解组合',breakcombo_opts,function(v){
      var dz=getDz0();h5gg.setValue(dz+0x32A,String(v*4),"U8");
      show('分解组合: '+breakcombo_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 后撤步
  c.appendChild(makeCollapse('移动后撤步',function(b){
    b.appendChild(makeRow('后撤步',stepback_opts,function(v){
      var dz=getDz0();
      h5gg.setValue(dz+0x115,String((v%8)*32),"U8");
      h5gg.setValue(dz+0x116,String(Math.floor(v/8)),"U8");
      show('后撤步: '+stepback_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 犹豫步
  c.appendChild(makeCollapse('移动犹豫步',function(b){
    b.appendChild(makeRow('犹豫步',hesitation_opts,function(v){
      var dz=getDz0();h5gg.setValue(dz+0x289,String(v),"U8");
      show('犹豫步: '+hesitation_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 扣篮包
  c.appendChild(makeCollapse('扣篮包 (15个槽位)',function(b){
    for(var i=0;i<dunk_set.length;i++){
      (function(slot){
        b.appendChild(makeRow(slot.n,dunk_opts,function(v){
          var dz=getDz0();h5gg.setValue(dz+slot.o,String(v),"U8");
          show(slot.n+': '+dunk_opts.find(function(x){return x.v===v}).t);
        }));
      })(dunk_set[i]);
    }
  }));

  // 三分庆祝
  c.appendChild(makeCollapse('三分庆祝动作',function(b){
    b.appendChild(makeRow('三分庆祝',qz3_opts,function(v){
      if(v===0)return;
      var dz=getDz0();
      var pp=Number(h5gg.getValue(dz+0x50,"I64"));
      h5gg.setValue(pp+0x1C,String(qz3_data[v]),"I8");
      show('三分庆祝: '+qz3_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 两分庆祝
  c.appendChild(makeCollapse('两分庆祝动作',function(b){
    b.appendChild(makeRow('两分庆祝',qz2_opts,function(v){
      if(v===0)return;
      var dz=getDz0();
      var pp=Number(h5gg.getValue(dz+0x50,"I64"));
      h5gg.setValue(pp+0x20,String(qz2_data[v]),"I8");
      show('两分庆祝: '+qz2_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 站立庆祝
  c.appendChild(makeCollapse('站立庆祝动作',function(b){
    b.appendChild(makeRow('站立庆祝',qz1_opts,function(v){
      if(v===0)return;
      var dz=getDz0();
      var pp=Number(h5gg.getValue(dz+0x50,"I64"));
      var d=qz1_data[v];
      h5gg.setValue(pp+0x24,String(d[0]),"I8");
      h5gg.setValue(pp+0x25,String(d[1]),"I8");
      show('站立庆祝: '+qz1_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 扣篮庆祝
  c.appendChild(makeCollapse('扣篮庆祝动作',function(b){
    b.appendChild(makeRow('扣篮庆祝',qz4_opts,function(v){
      if(v===0)return;
      var dz=getDz0();
      var pp=Number(h5gg.getValue(dz+0x50,"I64"));
      var d=qz4_data[v];
      h5gg.setValue(pp+0x28,String(d[0]),"I8");
      h5gg.setValue(pp+0x29,String(d[1]),"I8");
      show('扣篮庆祝: '+qz4_opts.find(function(x){return x.v===v}).t);
    }));
  }));

  // 投篮包 (3个槽位)
  var shot_opts=[];
  for(var i=0;i<shot_names.length;i++)shot_opts.push({t:shot_names[i],v:i});
  c.appendChild(makeCollapse('投篮包 (3个槽位)',function(b){
    for(var si=0;si<shot_slots.length;si++){
      (function(slot,idx){
        b.appendChild(makeRow(slot.n,shot_opts,function(v){
          shot_vals[idx]=v;
          show(slot.n+' = '+shot_names[v]+' ('+v+')');
        }));
      })(shot_slots[si],si);
    }
    var applyBtn=document.createElement('button');
    applyBtn.className='btn b-purple';applyBtn.style.cssText='width:100%;margin-top:6px;min-height:34px;font-size:11px';
    applyBtn.textContent='应用投篮包';
    applyBtn.addEventListener('click',function(){doJumpshot()});
    b.appendChild(applyBtn);
  }));
}
